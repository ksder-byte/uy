# DurdenVPN — nginx for the cabinet SPA + the optimized landing.
#
# What it fixes (see AUDIT.md for numbers):
#   * JS/CSS were sent without compression (gzip only covered text/html): 1.37 MB instead of ~380 KB.
#   * Two Cache-Control headers on /assets ("max-age=…" from `expires` + "public" from add_header).
#   * index.html had no Cache-Control: browsers could keep a stale page that points to deleted bundles.
#   * robots.txt / sitemap.xml / /health/unified / unknown files returned the SPA's index.html with 200.
#   * No HSTS / nosniff / clickjacking protection on a page that takes payments.
#   * /buy/landing loaded the whole cabinet (≈2 MB, 40 requests); now it is one static page (≈30 KB).
#
# Paths to adapt:
#   /usr/share/nginx/html        — cabinet build (index.html + /assets), as in the cabinet image
#   /var/www/durden-landing      — contents of this repo's landing/ and public/ folders
#   http://127.0.0.1:8081        — the bot's web API (the same upstream your /api/ already uses)
#   ssl_certificate paths        — your certificates

# ---------------------------------------------------------------- compression (http {} level)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml
           application/manifest+json image/svg+xml image/x-icon;
# If nginx is built with ngx_brotli, brotli is ~15–20% smaller than gzip for JS:
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css text/xml application/javascript application/json application/xml
#              application/manifest+json image/svg+xml image/x-icon;

upstream durden_api {
    server 127.0.0.1:8081;
    keepalive 16;
}

# ---------------------------------------------------------------- http → https, apex → www
server {
    listen 80;
    listen [::]:80;
    server_name durdenvpn.org www.durdenvpn.org;
    return 301 https://www.durdenvpn.org$request_uri;
}

server {
    listen 443 ssl http2;        # nginx >= 1.25.1: "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name durdenvpn.org;
    ssl_certificate     /etc/letsencrypt/live/durdenvpn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durdenvpn.org/privkey.pem;
    return 301 https://www.durdenvpn.org$request_uri;
}

# ---------------------------------------------------------------- main site
server {
    listen 443 ssl http2;        # nginx >= 1.25.1: "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name www.durdenvpn.org;
    ssl_certificate     /etc/letsencrypt/live/durdenvpn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durdenvpn.org/privkey.pem;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # add_header inside a location drops the server-level ones, so every location below
    # that sets its own headers includes this snippet again.
    include /etc/nginx/snippets/durden-security-headers.conf;

    # --- optimized landing (exact match: other /buy/<slug>, /buy/success/…, /buy/gift/… stay in the SPA)
    location = /buy/landing {
        default_type text/html;
        alias /var/www/durden-landing/index.html;
        include /etc/nginx/snippets/durden-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Clickjacking protection for the payment page; Telegram Web may still embed it as a Mini App.
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
    location ^~ /lp/ {
        alias /var/www/durden-landing/lp/;
        include /etc/nginx/snippets/durden-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";  # 30 days (names are not hashed); no "always": never cache a 404
        try_files $uri =404;
    }
    location = /favicon.ico {
        alias /var/www/durden-landing/lp/favicon.ico;
        include /etc/nginx/snippets/durden-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location = /robots.txt  { alias /var/www/durden-landing/robots.txt;  default_type text/plain; }
    location = /sitemap.xml { alias /var/www/durden-landing/sitemap.xml; default_type application/xml; }

    # --- cabinet bundles: hashed names → cache forever, one Cache-Control header, real 404s
    location ^~ /assets/ {
        include /etc/nginx/snippets/durden-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";  # no "always": a 404 during a deploy must not stick for a year
        access_log off;
        try_files $uri =404;
    }

    # --- API: keep your current /api/ block as is, just make it "^~" so the static-file
    # regex below never catches API URLs. Example (path stripping must match your current setup):
    location ^~ /api/ {
        proxy_pass http://durden_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The cabinet polls /health/unified (3× per page view) to detect maintenance. It currently
    # falls through to index.html (14 KB, always 200), so outages are never detected.
    # Check first that the bot answers it: curl -i http://127.0.0.1:8081/health/unified
    location = /health/unified {
        proxy_pass http://durden_api/health/unified;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Unknown static-looking files: real 404 instead of the SPA shell.
    location ~* \.(?:js|css|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|txt|xml|json)$ {
        try_files $uri =404;
    }

    # --- SPA routes: always revalidate the shell so a deploy never serves stale bundle names
    location / {
        include /etc/nginx/snippets/durden-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
